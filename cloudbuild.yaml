steps:
  # Step 1: Build the container image from the repository
  - name: 'gcr.io/k8s-skaffold/pack'
    entrypoint: 'pack'
    args:
      - 'build'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/edge-wildlife-monitor-git:$BUILD_ID'
      - '--builder'
      - 'gcr.io/buildpacks/builder:v1'
      - '--path'
      - '.'

  # Step 2: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/edge-wildlife-monitor-git:$BUILD_ID'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/edge-wildlife-monitor-git:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
